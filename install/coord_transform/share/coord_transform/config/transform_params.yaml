# transform_params.yaml
# Default values — update after running calibration script

coord_transform:
  ros__parameters:
    object_offset_x: 0.05
    object_offset_y: 0.0
    object_offset_z: 0.10

    cam_to_base_qx: 0.0
    cam_to_base_qy: 0.0
    cam_to_base_qz: 0.0
    cam_to_base_qw: 1.0

    cam_to_base_tx: 0.5
    cam_to_base_ty: 0.0
    cam_to_base_tz: 1.2

    ee_orient_x: 0.0
    ee_orient_y: 1.0
    ee_orient_z: 0.0
    ee_orient_w: 0.0

    # Axis remap: camera workspace → robot base frame
    # Robot X+ = phải→trái (camera view), camera x_ws+ = trái→phải → cần negate
    # Robot Y+ = về phía camera, camera y_ws+ = về phía camera → cùng chiều
    # Robot Z+ = lên trên, camera z_ws+ = lên trên → cùng chiều
    axis_remap: [0, 1, 2]
    axis_sign: [-1.0, 1.0, 1.0]
    prediction_step: 5

    workspace_x_min: -1.0
    workspace_x_max:  1.0
    workspace_y_min: -0.5
    workspace_y_max:  1.3
    workspace_z_min:  0.05
    workspace_z_max:  1.5

    # ── Bộ lọc nhiễu (Filter Parameters) ──────────────────────────────────
    # Outlier rejection: ngưỡng nhảy tọa độ thô tối đa giữa 2 frame (m)
    # Điểm nhảy hơn mức này sẽ bị loại bỏ (tối đa 5 frame liên tiếp)
    filter.outlier_threshold: 0.15

    # Median filter size cho trục Y (Depth) — giá trị lẻ: 3, 5, 7
    # ↓ 3 thay vì 7: giảm trễ nhóm từ ~100ms xuống ~33ms, vẫn đủ khử gai
    filter.median_size_y: 3

    # Moving deadband: ngưỡng độ lệch chuẩn (Standard Deviation) lớn nhất trên 3 trục để kích hoạt hold (m)
    # RealSense trục X có nhiễu cao hơn Kinect → tăng lên 0.035 để vào HOLD ổn định hơn.
    # Nếu đường Actual vẫn dày, thử tăng lên 0.04.
    filter.deadband_depth_tol: 0.015

    # Số frame liên tiếp tĩnh để kích hoạt hold
    # Giảm xuống 3 để hold nhanh hơn
    filter.stationary_threshold: 3

    # Target Snap: snap GRU prediction về actual hand khi tay đứng yên (m)
    # 0.10 = 10cm — đủ bắt overshoot GRU thông thường
    filter.pred_snap_radius: 0.10

    # Ngưỡng Y (camera frame, sau median filter, đơn vị mét) để kích hoạt deadband dừng.
    # Khi Y < ngưỡng: robot KHÔNG áp dụng deadband di chuyển → xuất phát sớm ngay khi tay nhúc nhích.
    # Khi Y >= ngưỡng: robot áp dụng deadband với tol cao (near_target_tol) để dừng chắc tại đích.
    # Điều chỉnh 0.30 theo khoảng cách thực tế từ camera đến điểm bắt đầu hành trình.
    filter.deadband_y_threshold: 0.30

    # Ngưỡng std tối đa (m) để xác nhận tay đã đứng yên tại vùng đích (Y >= threshold).
    # 0.025 = 2.5cm — rộng hơn để dừng chắc dù tay còn rung nhẹ khi mang tải.
    filter.deadband_near_target_tol: 0.025

    # Rate-limiter tọa độ đích cuối cùng (m) — bước nhảy tối đa mỗi frame
    filter.max_rate: 0.05

    # EMA alpha khi ĐANG DI CHUYỂN (0 = không theo, 1 = raw)
    # Tăng lên 1.0 (raw) để bỏ hoàn toàn độ trễ, giúp robot nhạy nhất khi bị gắn cứng.
    filter.ema_x_moving: 1.0
    filter.ema_y_moving: 0.8
    filter.ema_z_moving: 1.0

    # EMA alpha khi ĐANG HOLD (lock vị trí)
    # Giữ càng thấp càng tốt để robot đứng yên hoàn toàn
    filter.ema_x_hold: 0.08
    filter.ema_y_hold: 0.02
    filter.ema_z_hold: 0.05

    # ── Target Zone Auto-Snap ─────────────────────────────────────────────
    # Khi EE robot vào trong snap_radius của một target zone
    # trong snap_frames frame liên tiếp → snap chính xác vào pose đó,
    # giữ snap_duration_sec giây, rồi tự động Stop Run.
    # Dùng capture_targets.py để capture tọa độ T1/T2/T3 từ robot thật.
    target_zones.enabled: true
    target_zones.snap_radius: 0.08        # 8cm — bán kính vùng nhận diện
    target_zones.snap_frames: 8          # 10 frame liên tiếp phải ở trong vùng
    target_zones.snap_duration_sec: 0.3   # thời gian giữ pose trước khi stop

    # Tọa độ EE trong base_link (sẽ được cập nhật bởi capture_targets.py)
    target_zones.t1_x: -0.287823
    target_zones.t1_y: 0.976377
    target_zones.t1_z: 0.361530

    target_zones.t2_x: 0.047798
    target_zones.t2_y: 1.120817
    target_zones.t2_z: 0.477037

    target_zones.t3_x: 0.302819
    target_zones.t3_y: 1.032950
    target_zones.t3_z: 0.339642
