# Predictor parameters
trajectory_predictor:
  ros__parameters:
    # Model configuration
    model_dir: "/home/hungnb/cocarry_ws/pHRI_Models/svgp_hri_m52"
    default_model: "svgp"
    
    # Model file names (must match files in model_dir)
    model_files:
      rnn: "rnn_model_Ts5.h5"
      gru: "gru_model_Ts5.h5"
      lstm: "lstm_model_Ts5.h5"
      svgp: "svgp_model.pkl"
    
    # Scaler file names
    scaler_x_file: "scaler_x.pkl"
    scaler_y_file: "scaler_y.pkl"
    
    # Prediction parameters (must match training config)
    window_size: 10             # T = input sequence length
    num_features: 3             # x, y, z
    
    # Behavior
    auto_start: false           # Start predicting immediately on launch
    clear_on_tracking_lost: 1.0 # Clear buffer if no data for N seconds

    # ── Hybrid GRU+MJM ──────────────────────────────────────────────────────
    # Bật bằng cách click nút "GRU+MJM" trên UI (publish /predictor/hybrid_cmd)
    mjm:
      enabled: false       # false = GRU thuần; true = kích hoạt Hybrid khi Start Run
      t_switch: 6.0        # T_SWITCH (giây): tính từ khi Start Run (prediction bật)
      goal_x: -0.0578      # X_f của phương trình MJM (tọa độ đích, camera frame)
      goal_y:  0.7138      # X_f
      goal_z:  0.0         # X_f
      fitts_a: 3.5971      # Fitts' Law hệ số hằng số a (s)
      fitts_b: 0.6635      # Fitts' Law hệ số độ dốc b (s)
      fitts_w: 0.3         # Fitts' Law target width W (m)
