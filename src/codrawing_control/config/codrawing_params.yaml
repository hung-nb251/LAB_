admittance_controller:
  ros__parameters:
    # Đồng bộ nhịp phát target với Cartesian Streamer của HC10DTP (15 Hz).
    control_rate_hz: 15.0

    # M*e_ddot + D*e_dot + K*e = F_h, e = x_r - x_d.
    virtual_mass_x: 2.0
    virtual_mass_y: 2.0
    damping_x: 15.0
    damping_y: 15.0
    stiffness_x: 20.0
    stiffness_y: 20.0

    # Axia UI đã áp radial deadband 4 N; không áp deadzone lần hai.
    intent_threshold_n: 0.0
    force_sign_x: 1.0
    force_sign_y: 1.0
    max_virtual_velocity_mps: 0.05
    max_virtual_acceleration_mps2: 0.20

    # Workspace tu dong tinh quanh drawing-tip tai luc Start Run.
    workspace_half_width_x_m: 0.5
    workspace_forward_y_m: 1.0
    forward_sign_y: 1.0
    safe_workspace_x_min_m: -1.4
    safe_workspace_x_max_m: 1.4
    safe_workspace_y_min_m: -0.5
    safe_workspace_y_max_m: 1.3
    safe_workspace_z_min_m: 0.05
    safe_workspace_z_max_m: 1.5

    # Dau thanh sat cach tool0 18 cm. Can xac nhan dau cua truc Z tren robot that.
    tool_tip_offset_x_m: 0.0
    tool_tip_offset_y_m: 0.0
    tool_tip_offset_z_m: -0.18

    # Fz chi dung bao ve. Cac nguong nay phai duoc xac nhan trong test toc do thap.
    max_planar_force_n: 15.0
    max_normal_force_n: 15.0
    force_timeout_sec: 0.20
    current_pose_timeout_sec: 0.25
    actual_z_tolerance_m: 0.010
    prediction_timeout_sec: 0.50

    auto_capture_on_start: true
    require_axia_calibrated: true

codrawing_logger:
  ros__parameters:
    log_dir: /home/hungnb/cocarry_ws/codrawing_logs

trajectory_predictor:
  ros__parameters:
    auto_start: false
    clear_on_tracking_lost: 1.0
    default_model: svgp
    filter:
      ema_alpha: 0.5
      enabled: true
      max_deviation: 0.08
      max_rate: 0.05
    model_dir: /home/hungnb/cocarry_ws/pHRI_Models/svgp_h5_m50_raw
    model_files:
      svgp: svgp_model.pkl
    num_features: 3
    scaler_x_file: scaler_x.pkl
    scaler_y_file: scaler_y.pkl
    window_size: 10
    mjm:
      enabled: true
      t_switch: 5.0
      goal_x: -0.152821
      goal_y: 0.566000
      goal_z: -0.032538
      fitts_a: 3.8697
      fitts_b: 0.7492
      fitts_w: 0.3
