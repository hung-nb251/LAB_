experiment_logger:
  ros__parameters:
    auto_start: true
    log_dir: /home/hungnb/cocarry_ws/cocarry_logs
realsense_tracker:
  ros__parameters:
    # model_path is passed dynamically from the launch file
    offset_x: 0.0029441434890031815
    offset_y: 0.07468471676111221
    offset_z: 0.9220000505447388
kinect_tracker:
  ros__parameters:
    offset_x: 0.0
    offset_y: 0.0
    offset_z: 0.0
    camera_namespace: '/kinect2/qhd'
# Bộ lọc tọa độ của transform_node — tăng initial_noise_tolerance cho Kinect
# vì depth noise của Kinect QHD (~20-50mm) lớn hơn RealSense (~5-10mm)
# Nếu noise_tolerance quá nhỏ, filter sẽ giữ tay ở gốc tọa độ → đồ thị Y bằng phẳng
transform_node:
  ros__parameters:
    filter:
      initial_noise_tolerance: 0.06  # 6cm — đủ lớn để vượt noise Kinect QHD
trajectory_predictor:
  ros__parameters:
    auto_start: false
    clear_on_tracking_lost: 1.0
    default_model: svgp
    filter:
      ema_alpha: 0.5
      enabled: true
      max_deviation: 0.08
      max_rate: 0.05
    model_dir: /home/hungnb/cocarry_ws/pHRI_Models/svgp_h5_m50_raw
    model_files:
      svgp: svgp_model.pkl
    num_features: 3
    scaler_x_file: scaler_x.pkl
    scaler_y_file: scaler_y.pkl
    window_size: 10
    mjm:
      enabled: true
      t_switch: 5.0
      goal_x: -0.152821
      goal_y:  0.566000
      goal_z: -0.032538
      fitts_a: 3.8697
      fitts_b: 0.7492
      fitts_w: 0.3
# ── Gravity Compensator cho cảm biến ATI Axia80-M20 ─────────────────────────
# Cập nhật mass_kg và com_x/y/z theo kích thước và khối lượng thực tế.
# com_z âm vì vật treo xuống phía dưới tâm cảm biến.
gravity_compensator:
  ros__parameters:
    payload:
      mass_kg: 0.33       # Đã tính toán: 3.27 N / 9.81 = 0.333 kg
      com_x:   0.0       #
      com_y:   0.0       #
      com_z:   0.045     # Đã tính toán từ Torque X/Y (4.5 cm)
    sensor_frame_id:  'axia_sensor_link'   # TF frame cảm biến (phải khớp URDF)
    base_frame_id:    'base_link'          # TF frame gốc world-fixed của robot
    bias_samples:     100                  # Số mẫu để tính bias (100Hz = 1 giây)
    deadband_force_n:   0.01               # Ngưỡng chết lực (N)
    deadband_torque_nm: 0.05             # Ngưỡng chết mô-men (Nm)
