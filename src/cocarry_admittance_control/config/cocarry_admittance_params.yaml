cocarry_admittance_controller:
  ros__parameters:
    # Dong bo voi streamer lich su cua HC10DTP: 15 Hz.
    control_rate_hz: 15.0

    # M*e_ddot + D*e_dot + K*e = F_h, e = x_r - x_d.
    # Dung chung cho Ground Truth va Prediction; chi nguon x_d thay doi theo mode.
    virtual_mass_x: 1.0
    virtual_mass_y: 1.0
    virtual_mass_z: 1.0
    stiffness_x: 5.0
    stiffness_y: 5.0
    stiffness_z: 5.0
    # Khi true, D duoc tinh tu dong: D_i = 2*sqrt(M_i*K_i).
    # Voi M=1, K=5: D=4.47213595 tren ca ba truc.
    critical_damping: true
    damping_x: 4.47213595
    damping_y: 4.47213595
    damping_z: 4.47213595

    # Axia UI da ap radial deadband 1.5 N. Soft deadzone Fz toi da 2 N chi duoc
    # ramp vao khi nhan dien X-, roi ramp ra sau hysteresis/dwell. Vi vay Z
    # thuan khi khong co X- giu nguyen do nhay. Dat 0.0 de quay lai hanh vi cu.
    intent_threshold_n: 0.0
    additional_z_deadzone_n: 2.0
    xminus_z_deadzone_force_enter_n: 0.50
    xminus_z_deadzone_force_exit_n: 0.20
    xminus_z_deadzone_velocity_enter_mps: 0.020
    xminus_z_deadzone_velocity_exit_mps: 0.010
    xminus_z_deadzone_ramp_sec: 0.25
    xminus_z_deadzone_release_dwell_sec: 0.30

    # Predictor va controller cung chay 15 Hz tren hai timer doc lap, nen tuoi
    # cua mau prediction la mot hang so chot luc launch, roi bat ky dau trong
    # [0, 66.7] ms. Can pha mot lan moi luot ve nua chu ky. Dat false de doi chung.
    prediction_phase_align_enabled: true
    prediction_phase_align_sec: 0.0333
    force_sign_x: 1.0
    force_sign_y: 1.0
    force_sign_z: 1.0

    # Gia tri lich su cua Cartesian Streamer (commit dau tien den hien tai).
    max_virtual_velocity_mps: 0.15
    max_virtual_acceleration_mps2: 0.50
    # Reference chi duoc di truoc feedback EE that toi da 30 mm.
    max_command_lead_m: 0.03

    # Controller va UI dung toa do goc EE (tool0) trong frame base_link.
    # Cau hinh tool hien tai la thanh ngang, khong dung cong thuc thanh doc
    # truoc day (0.05 + 0.1814 = 0.2314 m).
    safe_workspace_x_min_m: -1.4
    safe_workspace_x_max_m: 1.4
    safe_workspace_y_min_m: -0.5
    safe_workspace_y_max_m: 1.3
    safe_workspace_z_min_m: 0.0314
    safe_workspace_z_max_m: 1.5

    max_force_per_axis_n: 20.0
    max_force_norm_n: 30.0
    # Gap ngan chi dong bang reference; chi hard-fault neu mat luc 0.50 s.
    # Log 2026-09-03 da co jitter 0.190--0.246 s nen 0.20 s hard timeout
    # tao stop gia trong khi Axia van ket noi.
    force_stale_hold_sec: 0.20
    force_timeout_sec: 0.50
    # Pose watchdog hai tang: freeze reference khi jitter vuot 0.25 s; chi
    # disable neu feedback mat qua 0.50 s. Streamer dung cung hard timeout.
    current_pose_stale_hold_sec: 0.25
    current_pose_timeout_sec: 0.50
    prediction_timeout_sec: 0.50
    # SVGP la nominal x_d ngay ca khi luc nguoi nho/bang 0. Gioi han nay chi
    # chong AI nominal chay qua xa EE, khong phai gate dua tren luc.
    prediction_max_nominal_lead_m: 0.05
    # User-approved real/simulation nominal conditioning (2026-09-06).
    # GRU raw output remains unchanged; this conditions controller nominal only.
    prediction_reference_tau_sec: 0.5
    prepare_timeout_sec: 8.0
    min_prediction_buffer_size: 10
    require_axia_calibrated: true
    # Manual Hybrid MJM duration. The velocity/acceleration bounds remain the
    # hard lower bounds when this Fitts estimate is shorter.
    hybrid_fitts_a: 3.0
    hybrid_fitts_b: 0.7492
    hybrid_fitts_w: 0.3
    # Manual LEADER -> FOLLOWER: spread the prediction re-entry over a longer
    # interval so a fresh prediction offset cannot create a sharp speed-up.
    hybrid_reentry_blend_sec: 0.6
    hybrid_reentry_warmup_samples: 10
cocarry_admittance_logger:
  ros__parameters:
    # compact: one 30-column CSV, no JSON sidecars. Use diagnostic only for
    # controller debugging and calibration only for raw Axia/M310 acquisition.
    logging_profile: compact
    # Acquisition for calibration: CSV uses accepted pre-deadband estimates.
    # The /sensorless_force topic keeps its configured deadband/sanity limit.
    robot_force_log_unfiltered: true
    # M310-M315 are read sequentially; allow one complete six-register scan.
    robot_force_sample_timeout_sec: 0.40
    log_dir: /home/hungnb/cocarry_ws/cocarry_logs
    file_prefix: cocarry_admittance_3d

sensorless_force_node:
  ros__parameters:
    # Shadow-only M310-M315 estimator. A baseline is frozen at the rising edge
    # of Start Run; output is logged but remains invalid for role selection.
    baseline_min_scans: 12
    baseline_window_scans: 30
    baseline_max_joint_speed_rad_s: 0.02
    scan_gap_sec: 0.05
    request_timeout_sec: 1.0
    joint_state_timeout_sec: 0.25
    deadband_n: 1.0
    max_force_norm_n: 100.0

ee_position_tracker:
  ros__parameters:
    # SVGP duoc train tu robot EE resample deu tai 15 Hz. Timer cua tracker
    # lay mau latest joint state dung tan so nay, doc lap voi /joint_states.
    publish_rate_hz: 15.0

trajectory_predictor:
  ros__parameters:
    auto_start: false
    # Co-carry controller owns predictor Start/Stop sequencing.  Selecting a
    # UI mode alone must not start inference or retain a stale HOLD target.
    trajectory_mode_auto_toggle: false
    inference_rate_hz: 15.0
    clear_on_tracking_lost: 1.0
    default_model: gru
    # GRU la backend mac dinh va publish raw output. Profile SVGP bat lai
    # filter nay khi duoc chon bang prediction_model:=svgp.
    filter:
      ema_alpha: 0.5
      enabled: false
      max_deviation: 0.08
      max_rate: 0.05
    model_dir: /home/hungnb/cocarry_ws/pHRI_Models/gru_robot_ee_h5_relative_v1
    model_files:
      gru: gru_joint_Ts5_float16.tflite
      svgp: svgp_model.npz
    num_features: 6
    # Robot-EE GRU duoc train voi delta_p[k] = p[k] - p[k-1] tai 15 Hz.
    # Profile SVGP override thanh legacy_16hz_ema (khong dung voi 3 features).
    velocity_feature_mode: delta_position
    scaler_x_file: scaler_x.pkl
    scaler_y_file: scaler_y.pkl
    window_size: 20
    hold:
      # Force-guided co-carry: keep predicting when the EE is stationary.
      # Force-stale HOLD belongs to the controller and remains enabled.
      enabled: false
      time_based: true
      window_sec: 0.40
      max_motion_m: 0.003
      release_distance_m: 0.010
      publish_rate_hz: 15.0
    mjm:
      manual_control: true
      enabled: true
      publish_rate_hz: 15.0
      reference_timeout_sec: 0.25
      require_goal_cmd: true
      t_switch: 5.0
      goal_x: -0.152821
      goal_y: 0.566000
      goal_z: -0.032538
      fitts_a: 3.8697
      fitts_b: 0.7492
      fitts_w: 0.3
