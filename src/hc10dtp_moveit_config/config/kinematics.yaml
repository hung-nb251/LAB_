hc10dtp_arm:
  # TRAC-IK không được cài trên máy hungnb. Dùng plugin KDL đang có
  # trong ros-humble-moveit-kinematics để MoveIt luôn khởi tạo được solver.
  # Luồng robot thật vẫn mặc định dùng Local DLS IK và fail-closed.
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.050
  kinematics_solver_attempts: 3
